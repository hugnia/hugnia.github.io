name: Update and publish research portfolio

on:
  push:
  schedule:
    - cron: '24 8 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Find the previous publication snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=publication-snapshot&per_page=10" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.snapshot.outputs.run_id != ''
        with:
          name: publication-snapshot
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.snapshot.outputs.run_id }}
      - name: Render publications for a site edit
        if: github.event_name == 'push'
        run: python3 scripts/update_publications.py --offline --snapshot "$RUNNER_TEMP/publication-snapshot.json"
      - name: Refresh publications
        if: github.event_name != 'push'
        run: python3 scripts/update_publications.py --snapshot "$RUNNER_TEMP/publication-snapshot.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: publication-snapshot
          path: ${{ runner.temp }}/publication-snapshot.json
          retention-days: 30
          overwrite: true
      - name: Prepare site
        run: |
          mkdir -p _site/assets
          cp index.html cv.html styles.css publications.js _site/
          cp assets/agnia-sergeyuk-cutout.png assets/share-card.png _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..10}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" \
              --jq '.artifacts[].name' | grep -Fxq "$PAGES_ARTIFACT"; then
              exit 0
            fi
            sleep 2
          done
          echo "Pages artifact is still unavailable" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
